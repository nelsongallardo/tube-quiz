<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tube Sound Quiz - Guess the London Underground Line</title>
    <meta name="description" content="Can you identify London Underground lines just by their sound? Take the quiz and find out!">
    <meta property="og:title" content="Tube Sound Quiz">
    <meta property="og:description" content="Can you identify London Underground lines just by their sound? 10 questions, 10 lines. How well do you know the Tube?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tubesoundquiz.com/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Tube Sound Quiz">
    <meta name="twitter:description" content="Can you identify London Underground lines just by their sound? Take the quiz!">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Johnston+ITC:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="roundel">
                <div class="roundel-bar">TUBE QUIZ</div>
            </div>
            <h1>Guess the Tube Line</h1>
            <p class="subtitle">Each London Underground line has its own distinctive sound. Can you tell them apart?</p>
            <p id="loading-msg" class="subtitle">Loading...</p>
            <button id="start-btn" class="btn btn-primary" style="display:none">Start Quiz</button>
            <p class="hint">10 questions &bull; Listen &amp; guess</p>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div class="quiz-info">
                    <span id="question-num">Question 1/10</span>
                    <span id="score-display">Score: 0</span>
                </div>
            </div>

            <div class="quiz-body">
                <h2>Which line is this?</h2>
                <button id="play-btn" class="btn-play" aria-label="Play sound">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <circle cx="24" cy="24" r="23" stroke="currentColor" stroke-width="2"/>
                        <path d="M19 15L35 24L19 33V15Z" fill="currentColor"/>
                    </svg>
                    <span id="play-label">Play Sound</span>
                </button>

                <div id="options" class="options"></div>

                <div id="feedback" class="feedback hidden">
                    <div id="feedback-icon"></div>
                    <p id="feedback-text"></p>
                    <p id="feedback-detail"></p>
                    <button id="next-btn" class="btn btn-primary">Next Question</button>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <h1 id="results-title"></h1>
            <div class="score-circle">
                <span id="final-score"></span>
                <span class="score-label">out of 10</span>
            </div>
            <p id="results-message"></p>
            <div id="results-breakdown" class="results-breakdown"></div>
            <div id="share-native" class="results-actions" style="display:none">
                <button id="share-btn" class="btn btn-share">Share Result</button>
            </div>
            <div id="share-platforms" class="share-platforms" style="display:none">
                <button class="share-icon" data-platform="x" aria-label="Share on X">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </button>

                </button>
                <button class="share-icon" data-platform="facebook" aria-label="Share on Facebook">

                </button>
                <button class="share-icon" data-platform="reddit" aria-label="Share on Reddit">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>
                </button>
                <button class="share-icon" data-platform="copy" aria-label="Copy to clipboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                </button>
            </div>
            <div class="results-actions">
                <button id="restart-btn" class="btn btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p class="footer-contact">
            <a class="footer-link" href="https://github.com/nelsongallardo/tube-quiz" target="_blank" rel="noopener">Source</a>
            <span class="footer-sep" aria-hidden="true">·</span>
            <a class="footer-link" href="mailto:nensol85@gmail.com">Contact</a>
        </p>
    </footer>
